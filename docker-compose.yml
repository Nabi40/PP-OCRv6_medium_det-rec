services:
  ocr-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ocr_server_v6
    restart: unless-stopped

    expose:
      - "8010"

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:alpine
    container_name: ocr_nginx
    restart: unless-stopped

    depends_on:
      - ocr-server

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro